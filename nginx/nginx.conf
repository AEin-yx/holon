# Global settings - how nginx handles connections
events {
    worker_connections 1024;  # Max simultaneous connections per worker
}

http {
    # Tell nginx where your app container is
    upstream gatekeeper {
        server gatekeeper:3000;  # Docker service name:port
    }

    # HTTP Server - Redirect everything to HTTPS
    server {
        listen 80;  # Listen on port 80 (HTTP)
        server_name sixfoldopulence.duckdns.org;

        # Let's Encrypt needs this path to verify domain ownership
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # HTTPS Server - The secure one
    server {
        listen 443 ssl http2;  # Port 443 = HTTPS, http2 = faster
        server_name sixfoldopulence.duckdns.org;

        # SSL Certificate files (created by certbot)
        ssl_certificate /etc/letsencrypt/live/sixfoldopulence.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sixfoldopulence.duckdns.org/privkey.pem;
        
        # Security settings (which TLS versions to allow)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # File upload size limit
        client_max_body_size 10M;

        # When someone visits the homepage, redirect to /api
        location = / {
            return 301 https://$server_name/api;
        }

        # Handle all requests (including /api)
        location / {
            proxy_pass http://gatekeeper;  # Send to your app container
            proxy_http_version 1.1;

            # Tell your app who the real user is
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;  # http or https
            proxy_set_header Host $host;

            # WebSocket support (for real-time features)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
        }
    }
}